<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangá Online</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <!--1 STEP - BANNER-->
        <div class="banner-container">
            <img src="./assets/dragonballbanner.jpg" alt="Banner do Dragon Ball">
        </div>

        <!--2 STEP- TITULO-->
        <H1 class="h1"> <strong>Dragon Ball - Volume 1</strong></H1>
    </header>
    <main class="reader-container">

        <!--3 STEP IMAGE OF CURRENT PAGE-->
        <div class="pager-wrapper">
            <img src="./Assets/dragon-ball-vol-1-s Capa.jpg" alt="Capa do Dragon Ball - Vol. 1">
        </div>
        
        <!--4 STEP - CONTROL PANEL-->
        <div class="controls">
            <button class="btn">Anterior</button>
            <span class="page">Página 1 de 31</span>
            <button class="btn">Próxima</button>
        </div>
    </main>
</body>
</html>
